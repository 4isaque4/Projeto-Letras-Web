name: "Bug Report"
description: "Reporte de erro em frontend, backend ou integracao."
title: "[BUG] "
labels:
  - type:bug
  - status:backlog
body:
  - type: dropdown
    id: area
    attributes:
      label: Area afetada
      options:
        - Frontend
        - Backend
        - Fullstack
        - Infra
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir pagina X
        2. Clicar em Y
        3. Ver erro Z
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Resultado atual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, prints e contexto tecnico
      description: Cole stack trace, payload, status code ou screenshot.
