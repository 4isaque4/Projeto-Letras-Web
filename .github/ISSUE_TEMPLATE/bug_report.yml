name: Bug
description: Reportar erro ou regressao do Letras
title: "[BUG] "
labels:
  - type:bug
  - status:backlog
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Onde aconteceu e qual usuario/perfil foi afetado?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Liste o caminho ate o erro.
      placeholder: "1. Acessar...\n2. Clicar...\n3. Observar..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidencias
      description: Prints, logs, links de PR/commit ou mensagens de erro.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Painel web
        - API
        - Supabase/migrations
        - Integracao web-mobile
        - Realtime/sync
        - Outro
    validations:
      required: true
