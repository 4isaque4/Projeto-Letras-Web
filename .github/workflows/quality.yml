name: Quality Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    # O nome do job é o check obrigatório da branch protection — renomear
    # exige atualizar a proteção no mesmo momento, senão o merge trava.
    # Apesar do nome, hoje o gate cobre api, web e mobile.
    name: Web/API quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check
        env:
          # Os testes da API são mockados, mas o módulo de env aborta sem
          # estas variáveis — valores dummy bastam para o gate.
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-key
          # O check agora inclui o export web do Expo (build:mobile:web).
          EXPO_PUBLIC_API_URL: https://painel.letras.cloud/api/v1
